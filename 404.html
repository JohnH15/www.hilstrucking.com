<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Page not found | HILS TRUCKING LLC</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#004aad" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root { --blue: #004aad; --green: #00bf63; --navy: #071e3d; --muted: #475569; }
    * { box-sizing: border-box; }
    html { background: var(--navy); }
    body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px;
           font-family: 'Google Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; color: var(--navy);
           background: radial-gradient(1200px 600px at 20% 0%, #dbe7f7 0%, transparent 60%), radial-gradient(900px 600px at 100% 100%, #d9f5e6 0%, transparent 60%), #f2f6fc; }
    .card { width: 100%; max-width: 460px; text-align: center; padding: 36px 24px 28px; border-radius: 32px;
            background: rgba(255, 255, 255, 0.74); -webkit-backdrop-filter: blur(24px) saturate(1.7); backdrop-filter: blur(24px) saturate(1.7);
            border: 1px solid rgba(255, 255, 255, 0.8); box-shadow: 0 24px 60px -18px rgba(7, 30, 61, 0.35), inset 0 1px 0 #fff; }
    .card img { height: 46px; width: auto; display: block; margin: 0 auto 22px; }
    .code { font-size: 3.4rem; font-weight: 700; line-height: 1; color: var(--blue); letter-spacing: -.02em; }
    h1 { margin: 12px 0 8px; font-size: 1.4rem; line-height: 1.25; }
    p { margin: 0 0 24px; color: var(--muted); line-height: 1.55; }
    .btns { display: grid; gap: 10px; }
    .btns a { display: flex; align-items: center; justify-content: center; gap: 8px; height: 52px; border-radius: 999px; font-weight: 700; text-decoration: none; }
    .primary { background: var(--green); color: var(--navy); }
    .ghost { background: #fff; color: var(--blue); box-shadow: inset 0 0 0 1px #e5edf8; }
    a:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }
  </style>
</head>
<body>
  <main class="card">
    <a href="/" id="home1" aria-label="HILS TRUCKING LLC"><img src="/assets/logo.webp" width="568" height="211" alt="HILS TRUCKING LLC" /></a>
    <div class="code">404</div>
    <h1 id="t">This page does not exist</h1>
    <p id="d">The link may be old or mistyped. Everything about driving with HILS is on the main page.</p>
    <div class="btns">
      <a class="primary" id="apply" href="/#apply">Apply now</a>
      <a class="ghost" id="home" href="/">Main page</a>
    </div>
  </main>
  <script>
    (function () {
      var T = {
        en: { t: 'This page does not exist', d: 'The link may be old or mistyped. Everything about driving with HILS is on the main page.', apply: 'Apply now', home: 'Main page', p: '/' },
        uk: { t: 'Такої сторінки немає', d: 'Можливо, посилання застаріло або в ньому помилка. Усе про роботу з HILS на головній сторінці.', apply: 'Надіслати заявку', home: 'Головна сторінка', p: '/ua/' },
        ru: { t: 'Такой страницы нет', d: 'Возможно, ссылка устарела или в ней ошибка. Все о работе с HILS на главной странице.', apply: 'Подать заявку', home: 'Главная страница', p: '/ru/' }
      };
      var l = 'en';
      try { l = localStorage.getItem('hils_lang') || ''; } catch (e) {}
      if (!T[l]) {
        var nav = (navigator.languages || [navigator.language || 'en']).join(',').toLowerCase();
        l = /(^|,)uk/.test(nav) ? 'uk' : /(^|,)(ru|be)/.test(nav) ? 'ru' : 'en';
      }
      var x = T[l];
      document.documentElement.lang = l;
      document.getElementById('t').textContent = x.t;
      document.getElementById('d').textContent = x.d;
      document.getElementById('apply').textContent = x.apply;
      document.getElementById('apply').href = x.p + '#apply';
      document.getElementById('home').textContent = x.home;
      document.getElementById('home').href = x.p;
      document.getElementById('home1').href = x.p;
    })();
  </script>
</body>
</html>
